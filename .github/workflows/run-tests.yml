name: run-tests

# Called by pr.yml and nightly.yml. One job runs one set of tags against one environment and
# leaves its own test report, HTML report and traces, so sets never overwrite each other.
on:
  workflow_call:
    inputs:
      name:
        description: Name of the set; titles the test report and names the artifacts
        required: true
        type: string
      env:
        description: TEST_ENV to run against
        required: true
        type: string
      tags:
        description: Tags to run, a regular expression such as '@smoke'
        required: true
        type: string
      allow-failure:
        description: Report failures without failing the job
        required: false
        type: boolean
        default: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: write
    env:
      CI: true
      TEST_ENV: ${{ inputs.env }}
      TAGS: ${{ inputs.tags }}
      # init-project: environments, one URL variable per environment
      BASE_URL_PR: ${{ vars.BASE_URL_PR }}
      BASE_URL_STAGING: ${{ vars.BASE_URL_STAGING }}
      BASE_URL_PROD: ${{ vars.BASE_URL_PROD }}
      # init-project: login, none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # init-project: package manager
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # init-project: browsers
      - run: bunx playwright install --with-deps chromium
      - id: tests
        run: bun run test --pass-with-no-tests
        continue-on-error: ${{ inputs.allow-failure }}
      # init-project: reporters
      - uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.name }} results
          path: .playwright/results.xml
          reporter: java-junit
          fail-on-error: ${{ !inputs.allow-failure }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: report-${{ inputs.name }}
          path: .playwright/report
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        with:
          name: traces-${{ inputs.name }}
          path: .playwright/test-results
          retention-days: 7
