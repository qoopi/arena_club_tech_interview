name: pr

# init-project: git flow, the branches that receive pull requests
on:
  pull_request:
    branches: [main, 'releases/**']

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck, lint and format check. Needs no browser.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # init-project: package manager
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

  # init-project: environments, the pull request environment and its tags
  smoke:
    uses: ./.github/workflows/run-tests.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      checks: write
    with:
      name: smoke
      env: pr
      tags: '@smoke'
